      clusterARN: arn:aws:ecs:eu-west-1:224712001626:cluster/cluster-auto-nlb
      Subnets:
        - subnet-0400a72924beec8b5
        - subnet-020125ecf50f20ce9
        - subnet-0ca440dee041a7eb7

      SecurityGroup: sg-04b0453140b04def0
      ExecutionRole: arn:aws:iam::224712001626:role/role-ecs-task
      Image: 773564674923.dkr.ecr.eu-west-1.amazonaws.com/sql-mcp-server:dev_38_6591250
      Cpu: 1024
      Memory: 2048
      ServiceDiscoveryNamespaceId: ns-vvwhxm4ur3pwvas3

    dev02:
      vpcID: vpc-084f188e1aa26832b
      clusterARN: arn:aws:ecs:eu-west-1:026581078905:cluster/cluster-test-nlb
      Subnets:
        - subnet-047b44ce8ccd91dfc
        - subnet-093a387f72b5a2053
        - subnet-08597644270f01c62

      SecurityGroup: sg-08ddd93e1247705bb
      ExecutionRole: arn:aws:iam::026581078905:role/role-ecs-task
      Image: 773564674923.dkr.ecr.eu-west-1.amazonaws.com/sql-mcp-server:dev_38_6591250
      Cpu: 1024
      Memory: 2048
      ServiceDiscoveryNamespaceId: ns-pxajqtzjmcvbpt4r

    uat:
      vpcID: vpc-08afd2e9b3421c41e
      clusterARN: arn:aws:ecs:eu-west-1:873297761902:cluster/cluster-uat-nlb
