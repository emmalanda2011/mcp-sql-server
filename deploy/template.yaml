AWSTemplateFormatVersion: '2010-09-09'
Description: This template Deploys an AWS Transit Gateway Attachment and Route creation to a centralized AWS Transit Gateway


Parameters:

  EnvironmentName:
    Description: An environment name that will be prefixed to resource names
    Type: String
    Default: dev02

  ServicePort:
    Type: Number
    Default: 5000

  ServiceName:
    Type: String
    Default: sql-mcp-server

