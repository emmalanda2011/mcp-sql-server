Resources:
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    # Makes sure the log group is created before it is used.
    Properties:
      # Name of the task definition. Subsequent versions of the task definition are grouped together under this name.
      Family: !Join ['', [!Ref ServiceName, '-service']]
      # awsvpc is required for Fargate
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      Cpu: !FindInMap [EnvMap, !Ref EnvironmentName, Cpu]
      Memory: !FindInMap [EnvMap, !Ref EnvironmentName, Memory]
      ExecutionRoleArn: !FindInMap [EnvMap, !Ref EnvironmentName,  ExecutionRole]
      # "The Amazon Resource Name (ARN) of an AWS Identity and Access Management (IAM) role that grants containers in the task permission to call AWS APIs on your behalf."
      TaskRoleArn: !FindInMap [EnvMap, !Ref EnvironmentName,  ExecutionRole]
      ContainerDefinitions:
        - Name: !Sub "${ServiceName}-service"
          Image: !FindInMap [EnvMap, !Ref EnvironmentName,  Image]
          PortMappings:
            - ContainerPort: !Ref ServicePort
          # Send logs to CloudWatch Logs
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-region: !Ref AWS::Region
              awslogs-group: !Sub "/ecs/${ServiceName}-service"
              awslogs-stream-prefix: ecs
  # A role needed by ECS

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      HealthCheckEnabled: true
      HealthCheckIntervalSeconds: 30
      HealthCheckProtocol: HTTP
      HealthCheckTimeoutSeconds: 10
      HealthyThresholdCount: 5
      HealthCheckPath: "/health"
      Name: !Sub "tg-${ServiceName}-1"
      Port: !Ref ServicePort
      Protocol: "HTTP"
      # TargetGroupAttributes:
      #   - TargetGroupAttribute
      # Targets:
      #   - TargetDescription
      TargetType: "ip"
      UnhealthyThresholdCount: 5
      VpcId: !FindInMap [EnvMap, !Ref EnvironmentName, vpcID]

  EcsService:
    Type: AWS::ECS::Service
    DependsOn: Listener
    Properties:
      Cluster: !FindInMap [EnvMap, !Ref EnvironmentName, clusterARN]
      DeploymentConfiguration:
        MaximumPercent: 200
        MinimumHealthyPercent: 100
      DesiredCount: 0
      EnableECSManagedTags: true
      EnableExecuteCommand: true
      HealthCheckGracePeriodSeconds: 0
      LaunchType: "FARGATE"
      LoadBalancers:
        - ContainerName: !Sub "${ServiceName}-service"
          ContainerPort:   !Ref ServicePort
          TargetGroupArn: !Ref TargetGroup
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: "DISABLED"
          SecurityGroups:
            - !FindInMap [EnvMap, !Ref EnvironmentName, SecurityGroup]
          Subnets: !FindInMap [EnvMap, !Ref EnvironmentName, Subnets]

      SchedulingStrategy: "REPLICA"
      ServiceName: !Sub "srv-${ServiceName}"
      TaskDefinition: !Ref TaskDefinition

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${ServiceName}-service"
      RetentionInDays: 30

  ApplicationLoadBalancer:
    Type: 'AWS::ElasticLoadBalancingV2::LoadBalancer'
    Properties:
      Name: !Sub "alb-${ServiceName}"
      Type: application
      Scheme: internal
      Subnets: !FindInMap [EnvMap, !Ref EnvironmentName, Subnets]
      SecurityGroups:
        - !FindInMap [EnvMap, !Ref EnvironmentName, SecurityGroup]


  Listener:
    Type: 'AWS::ElasticLoadBalancingV2::Listener'
    Properties:
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP